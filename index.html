<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stress Buddy Circuit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap">
<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"h h" "st ct";align-items:start}
header{grid-area:h}
h1{margin:0;font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted)}
h2{font-size:15px;font-weight:600;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.st{grid-area:st;display:grid;gap:10px;min-width:0}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage{position:relative;aspect-ratio:4/3;min-height:320px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0,var(--s1),var(--s2))}
#v3,#v2{position:absolute;inset:0}
#v3 canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#v3 canvas:active{cursor:grabbing}
#v2 svg{width:100%;height:100%;display:block}
#m3{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk3{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;margin:-12px 0 0 -12px;padding:0 9px 0 0;height:24px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--ink);font:500 12px var(--f);cursor:pointer;pointer-events:auto;white-space:nowrap}
.mk3 i{flex:none;width:24px;height:24px;margin:-1px 0 -1px -1px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 12px/24px var(--f);text-align:center;font-style:normal}
#m3.nn .mk3{padding:0;background:transparent;border:0}
#m3.nn .mk3 span{display:none}
#m3.nn .mk3.sel span{display:inline}
.mk3.sel{outline:3px solid var(--amb);outline-offset:1px}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.info{min-height:62px}
.info b{font-weight:600}
.info p{margin:2px 0 0;color:var(--muted)}
.ct{grid-area:ct;display:grid;gap:16px;min-width:0}
.sw{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw.dis{opacity:.45;pointer-events:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.tr{flex:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s}
.tr::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked+.tr{background:var(--accent)}
.sw input:checked+.tr::after{transform:translateX(18px)}
.sw input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.sw span.n{flex:1}
.sw small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:500 13px var(--f);padding:8px 18px;cursor:pointer;min-height:36px}

.btn{font:500 13px var(--f);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sl label{display:flex;justify-content:space-between;font-weight:500}
.sl output{font-family:var(--m)}

.m{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;margin:10px 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c)}
.m b{font:500 13px var(--m);text-align:right}
.lgd{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}

.lgd i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 11px/20px var(--f);text-align:center;font-style:normal}
.lgd li.sel button{font-weight:600}
.w{fill:none;stroke:var(--wire);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.f{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 7;animation:fl .5s linear infinite;opacity:0}
@keyframes fl{to{stroke-dashoffset:-12}}
.blk{fill:var(--panel);stroke:var(--wire);stroke-width:2}
#v2 text{font:500 12px var(--m);fill:var(--ink)}
#v2 .net{fill:var(--muted)}
#v2 .ttl{font:600 13px var(--f)}
.mk{cursor:pointer}
.mk circle{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.mk text{fill:var(--accent-ink)!important;font:600 12px var(--f)!important;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.sel circle{stroke:var(--amb);stroke-width:5}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"h" "st" "ct"}}
@media (prefers-reduced-motion:reduce){.tr,.tr::after{transition:none}.f{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Stress Buddy Circuit</h1></header>

<div class="st">
  <div class="bar2">
    <div class="seg" id="vw"><button data-v="fig" aria-pressed="false">Figure</button><button data-v="3d" aria-pressed="true">3D</button><button data-v="2d" aria-pressed="false">2D</button></div>

  <div class="stage" id="stage">

  <div class="card info" id="info"></div>
</div>

<div class="ct">

    <label class="sw"><input type="checkbox" id="ft" checked><span class="tr"></span><span class="n">Finger on sensors<small>Contact with the hand</small></span></label>

    <label class="sw dis" id="wmsw"><input type="checkbox" id="wm" checked><span class="tr"></span><span class="n">Show woman<small>Figure view</small></span></label>
    <div class="sl" style="margin-top:8px"><label for="rc">Body response <output id="rco">3</output></label><input type="range" id="rc" min="0" max="10" step="1" value="3"></div>
  </div>
  <div class="card" id="scard" hidden>
    <h2>Session</h2>
    <div class="seg" style="display:flex"><button id="pb" style="flex:1" aria-pressed="false">Baseline</button><button id="pe" style="flex:1" aria-pressed="true">Exposure</button></div>
    <div style="margin-top:10px"><button class="btn" id="nx">Next statement</button></div>
  </div>
  <div class="card">
    <h2>Readings</h2>
    <div class="m"><span>Heart rate</span><div class="bar"><i id="bh" style="--c:var(--hr)"></i></div><b id="vh">--</b></div>
    <div class="m"><span id="gl">GSR</span><div class="bar"><i id="bg" style="--c:var(--gsr)"></i></div><b id="vg">--</b></div>
    <div class="m"><span>Sweat</span><div class="bar"><i id="bs" style="--c:#3b8fd9"></i></div><b id="vs">0%</b></div>
    <div class="m"><span>Stress</span><div class="bar"><i id="bx" style="--c:var(--accent)"></i></div><b id="vx">--</b></div>
  </div>
  <div class="card" id="pcard"><h2>Parts</h2><ul class="lgd" id="lgd"></ul></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),T=THREE;

const S={on:1,ct:1,sub:0,wm:1,ph:'exp',st:0,sw:8,x:3,vw:'3d',bpm:70.04,gsr:1.652,ix:0,t:0,beat:0,fl:0,sel:0};

const scene=new T.Scene(),cam=new T.PerspectiveCamera(38,4/3,.5,300);

  const es=new T.Scene(),gc=document.createElement('canvas');gc.width=16;gc.height=256;
  const g=gc.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#dfe6f2');gr.addColorStop(.5,'#8e96a8');gr.addColorStop(1,'#2b2a33');g.fillStyle=gr;g.fillRect(0,0,16,256);

const key=new T.DirectionalLight(0xffffff,1.5);key.position.set(14,30,22);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:5,far:90});key.shadow.bias=-.0004;key.shadow.normalBias=.03;

const cy=(p,r,h,m,x,y,z,s)=>add(p,new T.CylinderGeometry(r,r,h,s||24),m,x,y,z);

  const s=new T.Sprite(new T.SpriteMaterial({map:t,color:hex,blending:T.AdditiveBlending,transparent:true,depthWrite:false,opacity:0}));s.scale.set(sz,sz,1);return s}

/* ---------- desk ---------- */
{const t=ctex(1024,1024,(c,w,h)=>{c.fillStyle='#24413b';c.fillRect(0,0,w,h);c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;
  for(let i=0;i<=20;i++){c.beginPath();c.moveTo(i*51.2,0);c.lineTo(i*51.2,h);c.moveTo(0,i*51.2);c.lineTo(w,i*51.2);c.stroke()}

  t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(3,2.4);
  const d=add(scene,new T.PlaneGeometry(72,56),M(0xffffff,{map:t,roughness:.85}),0,0,0);d.rotation.x=-Math.PI/2}

/* ---------- arduino uno r3 ---------- */
const AP=V(-7.5,.3,3.0),PT=.16,HT=.85;
const AW=6.86,AD=5.34,hx=mm=>mm/10-AW/2;

for(let i=0;i<6;i++)APIN['A'+i]=[hx(50.3+i*2.54),2.416];
const apin=n=>V(AP.x+APIN[n][0],AP.y+PT+HT,AP.z+APIN[n][1]);
const A=new T.Group();A.position.copy(AP);scene.add(A);
const aled={};
{
  rbox(A,AW,PT,AD,.25,M(0x0a8892,{roughness:.38}),0,0,0,[[13.97,2.54],[15.24,50.8],[66.04,7.62],[66.04,35.56]].map(q=>[hx(q[0]*1)+0,AD/2-q[1]/10,.16]));
  const px=x=>(x+AW/2)*200,pz=z=>(z+AD/2)*200;
  ov(A,ctex(1372,1068,(c)=>{c.fillStyle='#f4f8f8';c.textAlign='center';c.font='500 22px Outfit,sans-serif';

    ['IOREF','RESET','3V3','5V','GND','GND','VIN'].forEach((n,i)=>lab(n,hx(30+(i+1)*2.54),1.98));

    c.font='700 64px Outfit,sans-serif';lab('UNO',-1.2,.55);c.font='600 40px Outfit,sans-serif';lab('ARDUINO',-1.2,1.1);
    c.font='700 70px Outfit,sans-serif';lab('\u221e',-2.1,-.75);
    c.font='500 20px Outfit,sans-serif';lab('L',1.9,-1.35);lab('TX',2.35,-1.35);lab('RX',2.8,-1.35);lab('ON',.9,-1.35);lab('RESET',-2.35,-1.55)}),AW,AD,PT+.003);

    for(let i=0;i<n;i++)bx(A,.12,.012,.12,M(0x000000),hx(x0)+i*.254,PT+HT+.002,z)};
  hdr(10,17.5,-2.416);hdr(8,43,-2.416);hdr(8,30,2.416);hdr(6,50.3,2.416);
  // usb-b
  bx(A,1.6,1.1,1.2,STEEL,-3.43,PT+.55,-.9);bx(A,.2,.7,.8,BLK,-4.2,PT+.55,-.9);

  bx(A,3.6,.3,.85,M(0x232327),.97,PT+.15,1.25);

  if(!S.on){}else if(!S.ct){a='NO SIGNAL';b='Place finger'}
  else{a=(S.ph==='exp'?S.x:0)<=1?'Resting':'Stress '+r+'/10 ';b='HR '+d.bpm+(S.sub?' SM ':' GSR ')+(S.sub?Math.round(d.gsr*RAW):d.gsr.toFixed(1))}
  const key=S.on+a+b;if(key===lk)return;lk=key;
  const c=lcv.getContext('2d');c.fillStyle=S.on?'#2a64d8':'#7e8a86';c.fillRect(0,0,640,148);
  for(let r_=0;r_<2;r_++)for(let i=0;i<16;i++){c.fillStyle=S.on?'#2459c4':'#76827e';c.fillRect(i*40+3,r_*74+5,34,64)}
  if(S.on){c.fillStyle='#eef5ff';c.font='bold 52px "DM Mono",monospace';c.textAlign='center';c.textBaseline='middle';
    [a,b].forEach((s,r_)=>s.slice(0,16).split('').forEach((ch,i)=>c.fillText(ch,i*40+20,r_*74+38)))}
  ltex.needsUpdate=true;
  if($('#sl1')){$('#sl1').textContent=a;$('#sl2').textContent=b}}

/* ---------- frame ---------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;model(dt);
  const d=disp(),hot=d.ok&&(d.bpm>85||d.gsr>3),r=rating();lcd(d);
  if(S.vw==='3d'&&renderer){
    if(ease>0){ease--;['th','ph','r','tx','ty','tz'].forEach(k=>Vw[k]+=(Gw[k]-Vw[k])*.1)}
    cam.position.set(Vw.tx+Vw.r*Math.sin(Vw.ph)*Math.sin(Vw.th),Vw.ty+Vw.r*Math.cos(Vw.ph),Vw.tz+Vw.r*Math.sin(Vw.ph)*Math.cos(Vw.th));
    cam.lookAt(Vw.tx,Vw.ty,Vw.tz);
    const blink=calm||Math.floor(S.t*3)%2;
    GL.m.emissiveIntensity=d.ok?1.6:0;GL.s.material.opacity=d.ok?.7:0;
    const rl=hot&&blink;RL.m.emissiveIntensity=rl?1.8:0;RL.s.material.opacity=rl?.8:0;
    pulseLed.material.emissiveIntensity=S.on?.5+S.fl*2.5:0;pulseGlow.material.opacity=S.on?.15+S.fl*.6:0;
    aled.ON.material.emissiveIntensity=S.on?2:0;aled.L.material.emissiveIntensity=S.on?S.fl*2.2:0;
    aled.TX.material.emissiveIntensity=S.on&&S.fl>.5?1.5:0;aled.RX.material.emissiveIntensity=0;
    const p=S.sel&&info(S.sel);
    if(p){const a=p[3]();ring.position.set(a.x,Math.max(.6,a.y*.6),a.z);const k=3+Math.sin(S.t*4)*.4;ring.scale.set(k*(Vw.r/20+.5),k*(Vw.r/20+.5),1);ring.material.opacity=.5}else ring.material.opacity=0;
    WALL.visible=$('#wr').checked;
    renderer.render(scene,cam);place();
  }else if(S.vw==='fig'&&renderer){figFrame(d,hot)
  }else if(S.vw==='2d'){
    document.querySelectorAll('.f').forEach(p=>{const k=p.dataset.k;p.style.opacity=(k==='on'?S.on:k==='ok'?d.ok:k==='g'?d.ok:k==='r'?hot:0)?1:0});
    $('#sg').style.fillOpacity=d.ok?.9:.1;$('#sr').style.fillOpacity=hot?.9:.1;
    $('#svh').textContent=d.ok?d.bpm+' bpm':'';$('#svg').textContent=d.ok?gv(d.gsr)+(S.sub?'':' \u00b5S'):''}
  $('#vh').textContent=d.ok?d.bpm+' bpm':'--';
  $('#vg').textContent=d.ok?gv(d.gsr)+(S.sub?'':' \u00b5S'):'--';
  $('#bh').style.width=d.ok?clamp((d.bpm-50)/70*100,0,100)+'%':'0';
  $('#bg').style.width=d.ok?clamp(d.gsr/6*100,0,100)+'%':'0';
  $('#bs').style.width=S.sw.toFixed(1)+'%';$('#vs').textContent=Math.round(S.sw)+'%';
  $('#bx').style.width=d.ok?(r*10)+'%':'0';
  $('#vx').textContent=d.ok?r+'/10 '+mood(r):'--';
  requestAnimationFrame(tick)}

/* ---------- controls ---------- */
$('#pw').onchange=e=>S.on=+e.target.checked;
$('#ft').onchange=e=>S.ct=+e.target.checked;
$('#sb').onchange=e=>{S.sub=+e.target.checked;FX.R.visible=!S.sub;FX.U.visible=!!S.sub;flk='';REAL.visible=!S.sub;SUBG.visible=!!S.sub;WR.visible=!S.sub;WS.visible=!!S.sub;RK.visible=!!S.sub;
  $('#gl').textContent=S.sub?'Soil':'GSR';if(S.sel===8&&!S.sub)S.sel=0;sv();legend()};
$('#nm').onchange=e=>$('#m3').classList.toggle('nn',!e.target.checked);
$('#rc').oninput=e=>{S.x=+e.target.value;$('#rco').textContent=S.x};
$('#wm').onchange=e=>{S.wm=+e.target.checked;Gf={...Fhome[S.wm?1:0]};ease=70};
function setPh(p){S.ph=p;$('#pb').setAttribute('aria-pressed',p==='base');$('#pe').setAttribute('aria-pressed',p==='exp')}
$('#pb').onclick=()=>setPh('base');$('#pe').onclick=()=>setPh('exp');
$('#nx').onclick=()=>{S.st=(S.st+1)%ST.length;setPh('exp');S.t=Math.ceil(S.t/5)*5};
$('#vw').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  S.vw=b.dataset.v;const v=S.vw,g=v==='3d',fg=v==='fig';ease=0;
  document.querySelectorAll('#vw button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('#v3').hidden=v==='2d'||!renderer;$('#v2').hidden=v!=='2d';$('#m3').hidden=!g;$('#hint').hidden=v==='2d';$('#rv').hidden=v==='2d';
  $('#scard').hidden=!fg;$('#pcard').hidden=fg;$('#info').hidden=fg;
  ['#nsw','#wsw'].forEach(x=>$(x).classList.toggle('dis',!g));$('#wmsw').classList.toggle('dis',!fg);legend();lk='';flk=''};
if(!renderer){S.vw='2d';$('#v3').hidden=true;$('#v2').hidden=false;$('#vw').hidden=true;$('#rv').hidden=true;$('#hint').hidden=true}
sv();legend();lcd(disp());requestAnimationFrame(tick);
</script>
